apply plugin: 'com.android.application'

android {

    sourceSets.main.assets.srcDir(rootProject.file("module/webui/dist"))

    defaultConfig {
        applicationId "com.surcumference.fingerprintpay"
        minSdk 23
        targetSdk 37
        versionCode 61
        versionName "7.0.1"
        buildConfigField "String", "APP_PRODUCT_NAME", "\"FingerprintPay\""
    }

    buildTypes {
        release {
            minifyEnabled System.getenv("BUILD_RELEASE_MINIFYENABLED")?.toBoolean() ?: false
            shrinkResources System.getenv("BUILD_RELEASE_MINIFYENABLED")?.toBoolean() ?: false
            proguardFiles 'proguard-rules.pro'
        }
    }

    repositories{
        flatDir{
            dirs 'libs'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    //https://proandroiddev.com/how-to-securely-build-and-sign-your-android-app-with-github-actions-ad5323452ce#fromHistory
    def keystoreFile = file('keystore.jks')
    namespace 'com.surcumference.fingerprint'
    if (keystoreFile.exists()) {
        signingConfigs {
            release {
                storeFile = keystoreFile
                storePassword System.getenv("SIGNING_STORE_PASSWORD")
                keyAlias System.getenv("SIGNING_KEY_ALIAS")
                keyPassword System.getenv("SIGNING_KEY_PASSWORD")
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }
}
tasks.named('preBuild') {
    dependsOn(rootProject.tasks.named('verifyWebUi'))
}
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.outputs.each { output ->
        output.outputFileName.set("xposed.${android.defaultConfig.applicationId}.wechatfp.${android.defaultConfig.versionName}.${variant.buildType}.apk")
    }
}
apply from: rootProject.file('gradle/android-toolchain.gradle')
apply from: rootProject.file('gradle/legacy-fingerprint-stubs.gradle')

project.ext.appInfo = [
    Alipay:     "com.eg.android.AlipayGphone",
    Taobao:     "com.taobao.taobao",
    QQ:         "com.tencent.mobileqq",
    WeChat:     "com.tencent.mm",
    UnionPay:   "com.unionpay",
]
project.ext.moduleFrameworks = ['zygisk']

apply from: rootProject.file('gradle/app-payload.gradle')
apply from: 'debug.gradle'
apply from: 'update-json.gradle'
dependencies {
    implementation project(":3rdparty:FingerprintIdentify:FingerprintIdentifyLib")
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'com.umeng.analytics:analytics:6.1.2'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.github.getActivity:EasyHttp:13.8'
    implementation 'com.github.getActivity:Toaster:15.0'
    compileOnly 'de.robv.android.xposed:api:82'
}
