import java.security.MessageDigest
import java.nio.file.Files
import java.nio.file.StandardCopyOption

def deviceUser = project.findProperty('androidUser')?.toString() ?: '0'
if (!(deviceUser ==~ /0|[1-9][0-9]{0,4}/)) throw new GradleException('androidUser must be a non-negative Android user ID')
def adbCommand = [androidComponents.sdkComponents.adb.get().asFile.absolutePath]
if (project.hasProperty('adbSerial')) adbCommand += ['-s', project.property('adbSerial').toString()]
def runAdb = { List arguments ->
    providers.exec { commandLine(adbCommand + arguments) }.result.get().assertNormalExitValue()
}
def quote = { String value -> "'" + value.replace("'", "'\\''") + "'" }
def rootShell = { String command -> runAdb(['shell', 'su', '-c', quote("set -eu; " + command)]) }
def hash = { File file ->
    def digest = MessageDigest.getInstance('SHA-256')
    file.eachByte(65536) { bytes, size -> digest.update(bytes, 0, size) }
    digest.digest()
}
def exportDebugDex = tasks.register('exportDebugDex') {
    dependsOn('exportDebugPayload')
    def payload = layout.buildDirectory.file('outputs/payload/debug/payload.apk')
    def output = layout.buildDirectory.dir('outputs/dex/debug')
    inputs.file(payload)
    inputs.file(rootProject.file('module/prepare-payload.py'))
    outputs.dir(output)
    doLast {
        providers.exec {
            commandLine 'python3', rootProject.file('module/prepare-payload.py'), payload.get().asFile, output.get().asFile
        }.result.get().assertNormalExitValue()
        Files.move(new File(output.get().asFile, 'payload.bin').toPath(),
                new File(output.get().asFile, 'payload.dex').toPath(), StandardCopyOption.REPLACE_EXISTING)
    }
}

project.ext.appInfo.each { entry ->
    def name = entry.key
    def packageName = entry.value
    def stopApp = { runAdb(['shell', 'am', 'force-stop', '--user', deviceUser, packageName]) }
    def launchActivity = {
        for (tool in [['cmd', 'package'], ['pm']]) {
            def result = providers.exec {
                commandLine(adbCommand + ['shell'] + tool + ['resolve-activity', '--brief', '--user', deviceUser,
                        '-a', 'android.intent.action.MAIN', '-c', 'android.intent.category.LAUNCHER', packageName])
                ignoreExitValue = true
            }
            def component = result.standardOutput.asText.get().readLines().find { it ==~ /[A-Za-z0-9_.]+\/[A-Za-z0-9_.$]+/ }
            if (result.result.get().exitValue == 0 && component) return component
        }
        throw new GradleException("No launcher activity for $packageName, user $deviceUser")
    }
    def startApp = { String component -> runAdb(['shell', 'am', 'start', '--user', deviceUser, '-n', component]) }
    def stop = tasks.register("stop$name") { doLast { stopApp() } }
    tasks.register("start$name") {
        dependsOn(stop)
        doLast { startApp(launchActivity()) }
    }
    tasks.register("debug${name}Zygisk") {
        group = 'debug deployment'
        description = "Send self-contained Debug DEX, then restart $name (requires a loaded Debug Zygisk module)"
        dependsOn(exportDebugDex)
        doLast {
            def component = launchActivity()
            def dex = layout.buildDirectory.file('outputs/dex/debug/payload.dex').get().asFile
            def dexHash = hash(dex).encodeHex().toString()
            def generation = dexHash
            def module = 'zygisk-module-xfingerprint-pay-all'
            def data = "/data/user/$deviceUser/$packageName"
            def directory = "$data/files/${module}.debug"
            def target = "$directory/$generation"
            def staging = "/data/local/tmp/$module-debug-$packageName-$deviceUser-$generation"
            rootShell("test -f /data/adb/modules/$module/debug-file-dex || { echo 'Install and reboot with the Debug Zygisk module first' >&2; exit 1; }; test ! -f /data/adb/modules/$module/disable; test ! -f /data/adb/modules/$module/remove; test -d '$data/files'; test ! -L '$directory'")
            def probe = providers.exec {
                commandLine(adbCommand + ['shell', 'su', '-c', quote("if test -d '$target'; then printf present; fi")])
            }
            def present = probe.standardOutput.asText.get() == 'present'
            probe.result.get().assertNormalExitValue()
            if (!present) {
                runAdb(['shell', 'mkdir', '-p', staging])
                runAdb(['push', dex.absolutePath, "$staging/payload.dex"])
            }
            rootShell("""
                mkdir -p '$directory'
                if test ! -d '$target'; then
                    test \"\$(sha256sum '$staging/payload.dex' | cut -d' ' -f1)\" = '$dexHash'
                    mv '$staging' '$target'
                fi
                test ! -L '$target'
                test \"\$(sha256sum '$target/payload.dex' | cut -d' ' -f1)\" = '$dexHash'
                APP_UID=\$(stat -c %u '$data')
                APP_GID=\$(stat -c %g '$data')
                chown -R \"\$APP_UID:\$APP_GID\" '$directory'
                chmod 700 '$directory'
                chmod 500 '$target'
                chmod 444 '$target/payload.dex'
                test ! -L '$directory/.current-$generation'
                printf '%s' '$generation' > '$directory/.current-$generation'
                chown \"\$APP_UID:\$APP_GID\" '$directory/.current-$generation'
                chmod 444 '$directory/.current-$generation'
                restorecon -RF '$directory'
                mv -f '$directory/.current-$generation' '$directory/current'
            """)
            stopApp()
            startApp(component)
        }
    }
}
