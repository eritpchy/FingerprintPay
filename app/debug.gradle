ext {
    adbPath = androidComponents.sdkComponents.adb.get().asFile.absolutePath
    xposed = project.findProperty('xposed')?.toBoolean() ?: false
}
def adbPushToAppFiles(dexPath, targetName, targetPackage) {
    providers.exec {
        executable = adbPath
        args = ['push', dexPath, "/data/local/tmp/${targetName}"]
    }.result.get()
    providers.exec {
        executable = adbPath
        args = ["shell", "su", "-c", 
            """"NAME=${targetName} && \
            mv /data/local/tmp/\\\$NAME /data/data/$targetPackage/files/\\\$NAME && \
            chmod 444 /data/data/$targetPackage/files/\\\$NAME && \
            UID=\\\$(stat -c "%u" /data/data/$targetPackage) && \
            GID=\\\$(stat -c "%g" /data/data/$targetPackage) && \
            chown \\\$UID:\\\$GID /data/data/$targetPackage/files/\\\$NAME && \
            true" """]
    }.result.get()
}

project.ext.appInfo.each {entry ->
    def name = entry.key
    def packageName = entry.value
    def stopTask = tasks.create(name: "stop$name", type: Exec) {
        doFirst { println "Stop $name..." }
        executable = adbPath
        args = ['shell', "am force-stop $packageName"]
    }
    def startTask = tasks.create(name: "start$name", dependsOn: [stopTask], type: Exec) {
        doFirst { println "Start $name..." }
        executable = adbPath
        args = ['shell', "sleep 3;am start \$(cmd package resolve-activity --brief ${packageName} | tail -n 1)"]
    }
    def debugXposedTask = tasks.create(name: "debug${name}Xposed", dependsOn: ["installDebug", stopTask], type: Exec) {
        executable = adbPath
        args = ['shell', "package=${android.defaultConfig.applicationId}&& cp -f \$(pm path \$package| cut -d: -f2) /data/local/tmp/\$package.apk && chmod 777 /data/local/tmp/\$package.apk"]
    }
    debugXposedTask.finalizedBy(startTask)
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def buildTypeName = variant.buildType
    def buildTypeNameCapitalize = variant.name.capitalize()
    def apkDirectory = variant.artifacts.get(rootProject.androidApkArtifact)
    def exportDex = tasks.register("export${buildTypeNameCapitalize}Dex", Sync) {
        dependsOn(apkDirectory)
        from({
            def apks = fileTree(apkDirectory.get().asFile).matching { include '*.apk' }.files
            if (apks.size() != 1) throw new GradleException('Expected one APK for native module payload')
            def dexFiles = zipTree(apks.first()).matching { include 'classes*.dex' }.files
            if (dexFiles.size() != 1) throw new GradleException('Native modules require a single DEX payload')
            dexFiles
        })
        into layout.buildDirectory.dir("outputs/dex/${variant.name}")
    }

    project.ext.appInfo.each { entry ->
        def name = entry.key
        def packageName = entry.value
        project.ext.moduleFrameworks.each { framework ->
            def moduleTask = tasks.register("${buildTypeName}${name}${framework.capitalize()}") {
                dependsOn(exportDex)
                doLast {
                    def dexPath = layout.buildDirectory.file("outputs/dex/${variant.name}/classes.dex").get().asFile.absolutePath
                    adbPushToAppFiles(dexPath, "${framework}-module-xfingerprint-pay-${name.toLowerCase()}.dex", packageName)
                }
            }
            moduleTask.configure { finalizedBy("start$name") }
        }
    }

    tasks.matching { it.name == "install${buildTypeNameCapitalize}" }.configureEach {
        doLast {
            providers.exec {
                executable = adbPath
                args = ['shell', "monkey -p ${variant.applicationId.get()} -c android.intent.category.LAUNCHER 1"]
            }.result.get()
        }
    }
    variant.outputs.each { output ->
        output.outputFileName.set("xposed.${android.defaultConfig.applicationId}.wechatfp.${android.defaultConfig.versionName}.${buildTypeName}.apk")
    }
}

tasks.matching { it.name.startsWith('minify') && it.name.endsWith('WithR8') }.configureEach {
    inputs.property('xposed', xposed)
    doFirst {
        if (!xposed) {
            fileTree(layout.buildDirectory.dir('intermediates/aapt_proguard_file')).matching {
                include '**/aapt_rules.txt'
            }.files.each { it.delete() }
        }
    }
}
