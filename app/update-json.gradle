import groovy.json.JsonOutput

project.ext.moduleFrameworks.each { pluginType ->
    def versionName = android.defaultConfig.versionName
    def info = [
        version: "${versionName}",
        versionCode: "${android.defaultConfig.versionCode}",
        zipUrl: "https://file.xdow.net/d/download/fingerprintpay/$versionName/$pluginType-module-xfingerprint-pay-all-v$versionName-release.zip",
        changelog: "https://gitee.com/eritpchy/FingerprintPay/raw/main/CHANGELOG.md",
    ]
    (['all'] + project.ext.appInfo.keySet().collect { it.toLowerCase() }).each { name ->
        rootProject.file("release/update_${pluginType}_${name}.json").text = JsonOutput.prettyPrint(JsonOutput.toJson(info)) + '\n'
    }
}
