def toolchain = new Properties()
def toolchainPath = providers.gradleProperty('fingerprintRoot').map { it + '/gradle/android-toolchain.properties' }
        .getOrElse(rootProject.name == 'MagiskModuleTemplate' ? '../../gradle/android-toolchain.properties' : 'gradle/android-toolchain.properties')
rootProject.file(toolchainPath).withInputStream { toolchain.load(it) }
android {
    compileSdk {
        version = release(toolchain.compileSdk as int) {
            minorApiLevel = toolchain.compileSdkMinor as int
        }
    }
    buildToolsVersion = toolchain.buildToolsVersion
    ndkVersion = toolchain.ndkVersion
}
