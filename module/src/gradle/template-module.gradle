import org.apache.tools.ant.filters.FixCrLfFilter

import java.security.MessageDigest

plugins {
    id 'com.android.library'
}

apply from: rootProject.file('module.gradle')
apply from: rootProject.file(project.property('fingerprintRoot').toString() + '/gradle/android-toolchain.gradle')

android {
    namespace = 'com.example.app'
    defaultConfig {
        minSdk = 23
        externalNativeBuild {
            cmake {
                targets moduleLibraryName, "fpconfig"
                arguments "-DMODULE_NAME:STRING=$moduleLibraryName", "-DANDROID_STL=c++_static",
                        "-DFINGERPRINT_ROOT:PATH=${project.property('fingerprintRoot')}"
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
}

androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def variantCapped = variant.name.capitalize()
    def variantLowered = variant.name.toLowerCase()

    def zipName = "${magiskModuleId.replace('_', '-')}-${moduleVersion}-${variantLowered}.zip"
    def magiskDir = file("$outDir/magisk_module_$variantLowered")

    tasks.register("prepareMagiskFiles${variantCapped}", Sync) {
        dependsOn("assemble$variantCapped")
        def metadata = [
                id: magiskModuleId,
                name: moduleName,
                version: moduleVersion,
                versionCode: moduleVersionCode.toString(),
                author: moduleAuthor,
                description: moduleDescription,
                updateJson: moduleUpdateJson,
        ]
        inputs.properties(metadata)

        def templatePath = "$rootDir/template/magisk_module"

        into magiskDir
        from(templatePath) {
            exclude 'module.prop'
        }
        from(templatePath) {
            include 'module.prop'
            expand(metadata)
            filter(FixCrLfFilter.class,
                    eol: FixCrLfFilter.CrLf.newInstance("lf"))
        }
        from("$buildDir/intermediates/stripped_native_libs/$variantLowered/strip${variantCapped}DebugSymbols/out/lib") {
            into 'lib'
        }
        from(rootProject.file(project.property('fingerprintRoot').toString() + '/module/build/bin')) {
            include '**/fpconfig'
            into 'bin'
        }
        doLast {
            def resources = file("$magiskDir/resources.apk")
            def resourceHash = MessageDigest.getInstance('SHA-256').digest(resources.bytes).encodeHex().toString()
            def expectedHash = '"sha256":"' + resourceHash + '"'
            fileTree("$magiskDir/lib").matching { include '**/*.so' }.each { library ->
                if (!new String(library.bytes, java.nio.charset.StandardCharsets.ISO_8859_1).contains(expectedHash)) {
                    throw new GradleException("Native resource hash mismatch: ${library.name}")
                }
            }
            file("$magiskDir/description.original").text = metadata.description + "\n"
            if (variant.buildType == 'debug') file("$magiskDir/debug-file-dex").text = "1\n"
            fileTree("$magiskDir").visit { f ->
                if (f.directory) return

                def md = MessageDigest.getInstance("SHA-256")
                f.file.eachByte 4096, { bytes, size ->
                    md.update(bytes, 0, size)
                }
                file(f.file.path + ".sha256sum").text = md.digest().encodeHex()
            }
        }
    }

    tasks.register("zip${variantCapped}", Exec) {
        dependsOn("prepareMagiskFiles${variantCapped}")
        def packer = rootProject.file(project.property('fingerprintRoot').toString() + '/module/module_archive.py')
        inputs.dir(magiskDir)
        inputs.file(packer)
        def payload = rootProject.file(project.property('fingerprintRoot').toString() + '/module/build/payload/payload.bin')
        inputs.file(payload)
        outputs.file(new File(outDir, zipName))
        commandLine 'python3', packer, magiskDir, new File(outDir, zipName), payload
    }

    tasks.register("push${variantCapped}", Exec) {
        dependsOn("zip${variantCapped}")
        workingDir outDir
        commandLine androidComponents.sdkComponents.adb.get().asFile, "push", zipName, "/data/local/tmp/"
    }

    tasks.register("flash${variantCapped}", Exec) {
        dependsOn("push${variantCapped}")
        commandLine androidComponents.sdkComponents.adb.get().asFile, "shell", "su", "-c",
        """"if command -v magisk >/dev/null 2>&1; then
            magisk --install-module \"/data/local/tmp/${zipName}\"
        else
            apd module install \"/data/local/tmp/${zipName}\"
        fi;
        rm -fv \"/data/local/tmp/${zipName}\"" """
    }

    tasks.register("flashAndReboot${variantCapped}", Exec) {
        dependsOn("flash${variantCapped}")
        commandLine androidComponents.sdkComponents.adb.get().asFile, "shell", "reboot"
    }

    tasks.matching { it.name == "assemble${variantCapped}" }.configureEach {
        finalizedBy("zip${variantCapped}")
    }
}
