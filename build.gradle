// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.google.com' }
    }
    dependencies {
        def toolchain = new Properties()
        rootProject.file('gradle/android-toolchain.properties').withInputStream { toolchain.load(it) }
        classpath "com.android.tools.build:gradle:${toolchain.agpVersion}"
    }
}

ext.androidApkArtifact = com.android.build.api.artifact.SingleArtifact.APK.INSTANCE

allprojects {
    dependencyLocking {
        lockAllConfigurations()
    }
    repositories {
        exclusiveContent {
            forRepository { maven { url 'https://repo.maven.apache.org/maven2' } }
            filter { includeGroup 'net.xdow'; includeGroup 'org.lsposed.hiddenapibypass' }
        }
        def REPOSITORY_URL = 'https://maven.aliyun.com/nexus/content/groups/public/'
        all { ArtifactRepository repo ->
            if (repo instanceof MavenArtifactRepository) {
                def url = repo.url.toString()
                if (url.startsWith('https://repo1.maven.org/maven2') || url.startsWith('https://jcenter.bintray.com/')) {
//                    project.logger.lifecycle "Repository ${repo.url} replaced by $REPOSITORY_URL."
                    remove repo
                }
            }
        }
        maven {
            url REPOSITORY_URL
        }
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }

        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

apply from: rootProject.file('gradle/webui.gradle')
